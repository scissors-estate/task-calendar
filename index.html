<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務管理カレンダー</title>
<style>
  :root {
    --bg: #f0f3f8; --panel: #fff; --border: #dde3ed; --text: #1d2535;
    --muted: #6b7686; --accent: #3b6fd6; --accent-soft: #e8f0fe;
    --todo: #8fa0b8; --doing: #e69520; --done: #2a9f63;
    --overdue: #d63b3b; --soon: #e69520;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }

  /* ===== HEADER ===== */
  header {
    background: linear-gradient(120deg,#2c5cc5,#4a83e0);
    color:#fff; padding:12px 20px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 2px 8px rgba(40,80,200,.18); gap:8px; flex-wrap:wrap;
  }
  header h1 { font-size:17px; font-weight:700; }
  header p  { font-size:12px; opacity:.82; margin-top:2px; }

  /* ===== SUMMARY ===== */
  .summary-bar {
    display:flex; gap:6px; padding:9px 16px;
    background:#fff; border-bottom:1px solid var(--border); overflow-x:auto;
  }
  .stat {
    display:flex; align-items:center; gap:7px; padding:5px 12px;
    border-radius:18px; font-size:13px; white-space:nowrap;
    border:1px solid var(--border); background:#fff;
  }
  .stat .num { font-weight:700; font-size:15px; }
  .stat.over  { background:#fff2f2; border-color:#f8c4c4; color:#b03030; }
  .stat.soon2 { background:#fff7e6; border-color:#f5d99a; color:#a06010; }
  .stat.doing2{ background:#fffbf0; border-color:#f5d99a; color:#a06010; }
  .stat.done2 { background:#f0fbf5; border-color:#a8dfc0; color:#1a7a45; }

  /* ===== APP ===== */
  .app { display:flex; height:calc(100vh - 96px); min-height:380px; }
  .app.no-side .sidebar { display:none; }
  .cal-main { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width:270px; flex:none; background:var(--panel);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .sidebar-head {
    padding:12px 14px 8px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .sidebar-head h2 { font-size:14px; font-weight:700; }
  .sort-sel {
    font-size:11px; border:1px solid var(--border); border-radius:7px;
    padding:3px 6px; background:#f5f6f8; color:var(--muted); cursor:pointer;
  }
  .sort-sel:focus { outline:none; border-color:var(--accent); }
  /* ドラッグ並び替え */
  .task-card { display:flex; align-items:flex-start; gap:6px; }
  .task-card-body { flex:1; min-width:0; }
  .drag-handle {
    flex:none; cursor:grab; color:#c4cdd8; font-size:15px;
    line-height:1; padding-top:3px; user-select:none; display:none;
  }
  .drag-handle:active { cursor:grabbing; }
  .task-card.sortable .drag-handle { display:block; }
  .task-card.dragging { opacity:0.3; }
  .task-card.drag-over { box-shadow:inset 0 2px 0 var(--accent) !important; }
  .filters { display:flex; gap:4px; padding:8px 10px; flex-wrap:wrap; border-bottom:1px solid var(--border); }
  .chip {
    font-size:11px; padding:4px 9px; border-radius:18px;
    border:1px solid var(--border); background:#f5f6f8;
    cursor:pointer; color:var(--muted); user-select:none;
  }
  .chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .filters.owners { border-bottom:1px solid var(--border); padding-top:0; }
  .filters.owners .chip { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; }
  .task-scroll { flex:1; overflow-y:auto; padding:8px; }
  .task-scroll::-webkit-scrollbar { width:5px; }
  .task-scroll::-webkit-scrollbar-thumb { background:#d4dae3; border-radius:5px; }

  .task-card {
    border:1px solid var(--border); border-left:3px solid var(--todo);
    border-radius:8px; padding:9px 10px; margin-bottom:6px;
    background:#fff; cursor:pointer; transition:box-shadow .1s;
  }
  .task-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.09); }
  .task-card.doing   { border-left-color:var(--doing); }
  .task-card.done    { border-left-color:var(--done); }
  .task-card.overdue { border-left-color:var(--overdue); background:#fff7f7; }
  .task-card.recur   { border-left-style:dashed; }
  .task-card .tname  { font-size:13px; font-weight:600; line-height:1.3; }
  .task-card.done .tname { text-decoration:line-through; color:var(--muted); }
  .task-card .tmeta  { font-size:11px; color:var(--muted); margin-top:5px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .badge { font-size:10px; padding:1px 6px; border-radius:10px; color:#fff; font-weight:600; }
  .badge.todo    { background:var(--todo); }
  .badge.doing   { background:var(--doing); }
  .badge.done    { background:var(--done); }
  .badge.overdue { background:var(--overdue); }
  .badge.soon    { background:var(--soon); }
  .empty-msg { text-align:center; color:var(--muted); font-size:13px; padding:24px 8px; line-height:1.7; }

  /* ===== CALENDAR MAIN ===== */
  .cal-main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .cal-nav {
    display:flex; align-items:center; gap:7px;
    padding:9px 16px; background:var(--panel); border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .cal-nav .title { font-size:17px; font-weight:700; flex:1; min-width:100px; }
  .nav-btn {
    border:1px solid var(--border); background:#fff; border-radius:8px;
    padding:6px 11px; cursor:pointer; font-size:13px; color:var(--text);
    white-space:nowrap;
  }
  .nav-btn:hover { background:var(--accent-soft); border-color:var(--accent); }
  .nav-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .nav-btn.primary:hover { background:#2f5ec0; }
  .nav-btn.routine { background:#f5f0ff; color:#5b2fa0; border-color:#c8aeee; font-weight:600; }
  .nav-btn.routine:hover { background:#ede0ff; }
  .sel-hint { font-size:12px; color:var(--muted); background:#f8f9fb; border:1px solid var(--border); border-radius:8px; padding:5px 10px; }

  /* ===== 日付 × 担当者の表（2026-08-21 リニューアル） ===== */
  .ogrid-wrap { flex:1; overflow:auto; min-height:0; background:var(--panel); }
  .ogrid { --cols: 84px repeat(4, minmax(148px,1fr)); min-width:740px; }
  .orow { display:grid; grid-template-columns:var(--cols); border-bottom:1px solid var(--border); background:#fff; }
  .orow.head {
    position:sticky; top:0; z-index:3; background:#fafbfd;
    border-bottom:1px solid var(--border); box-shadow:0 1px 3px rgba(20,40,90,.06);
  }
  .orow.head .ocell {
    min-height:0; padding:8px 10px; flex-direction:row; align-items:center; gap:6px;
    font-size:12px; font-weight:700; color:var(--text);
  }
  .orow.wknd   { background:#fbfcfe; }
  .orow.today  { background:#f4f8ff; }
  .orow.sel    { background:#eaf1ff; box-shadow:inset 3px 0 0 var(--accent); }
  /* 「日付へ移動」で飛んだ先を少しの間光らせる */
  .orow.jump-hi, .mday.jump-hi { animation:jumpFlash 1.6s ease-out; }
  @keyframes jumpFlash { 0%,55%{ background:#fff2cc; } 100%{ background:transparent; } }
  .ocell {
    padding:6px 7px; border-right:1px solid #eef1f6;
    display:flex; flex-direction:column; gap:3px; min-height:52px; min-width:0;
  }
  .ocell:last-child { border-right:0; }
  .ocol { cursor:pointer; }
  .ocol:hover { background:rgba(59,111,214,.05); }
  .odate {
    background:#fafbfd; align-items:center; justify-content:center; gap:1px;
    cursor:pointer; user-select:none; position:sticky; left:0; z-index:2;
    border-right:1px solid var(--border);
  }
  .orow.wknd  .odate { background:#f5f7fb; }
  .orow.today .odate { background:#e7efff; }
  .orow.sel   .odate { background:#dde9ff; }
  .odate:hover { background:#eaf1ff; }
  .odate .dn { font-size:17px; font-weight:700; line-height:1.1; }
  .odate .dn.sun { color:#c83030; }
  .odate .dn.sat { color:var(--accent); }
  .odate .dw { font-size:10.5px; color:var(--muted); }
  .odate .tdy {
    font-size:9px; font-weight:700; color:#fff; background:var(--accent);
    border-radius:4px; padding:0 5px; margin-top:2px;
  }
  /* 空のマスの＋は、カーソルを乗せたときだけ出す（1か月表示で騒がしくならないように） */
  .ocol .empty-hint { font-size:11px; color:var(--accent); padding:2px 1px; opacity:0; transition:opacity .1s; }
  .ocol:hover .empty-hint { opacity:1; }

  .seg { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; flex:none; }
  .segb {
    font:inherit; font-size:12px; padding:6px 11px; border:0; background:#fff;
    color:var(--muted); cursor:pointer; font-weight:600;
  }
  .segb + .segb { border-left:1px solid var(--border); }
  .segb.active { background:var(--accent); color:#fff; }
  .nav-spacer { flex:1; min-width:0; }

  /* ===== スマホ表示：日ごとのカードを縦に並べる ===== */
  .mlist { padding:8px; display:flex; flex-direction:column; gap:8px; }
  .mday { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .mday.today { border-color:var(--accent); box-shadow:0 0 0 2px #c5d7ff; }
  .mhead {
    display:flex; align-items:center; gap:8px; padding:9px 11px;
    background:#fafbfd; cursor:pointer; border-bottom:1px solid #eef1f6;
  }
  .mday.wknd  .mhead { background:#f5f7fb; }
  .mday.today .mhead { background:#e7efff; }
  .mhead:active { background:#dde9ff; }
  .mdate { font-size:16px; font-weight:700; }
  .mdate.sun { color:#c83030; }
  .mdate.sat { color:var(--accent); }
  .mdow { font-size:12px; color:var(--muted); }
  .mhead .tdy {
    font-size:9.5px; font-weight:700; color:#fff; background:var(--accent);
    border-radius:4px; padding:1px 6px;
  }
  .mcnt { margin-left:auto; font-size:11px; color:var(--muted); white-space:nowrap; }
  .mbody { padding:7px 8px; display:flex; flex-direction:column; gap:5px; }
  .mbody .cal-pill { padding:8px 9px; font-size:12.5px; line-height:1.4; }
  .mbody .cal-pill .av { width:20px; height:20px; font-size:11px; }
  .mbody .pill-el { font-size:11px; }

  /* ===== 画面が狭いとき ===== */
  @media (max-width:820px){
    header { padding:9px 11px; }
    header h1 { font-size:15px; }
    header p  { display:none; }
    header button, #whoChip { padding:5px 8px !important; font-size:11px !important; }
    .summary-bar { padding:7px 10px; gap:5px; }
    .stat { padding:4px 9px; font-size:12px; }
    .app { height:calc(100vh - 88px); }
    .app .sidebar { display:none; }
    .cal-nav { gap:5px; padding:7px 8px; }
    .cal-nav .title { font-size:13px; min-width:0; }
    .nav-btn { padding:5px 8px; font-size:11.5px; }
    .segb { padding:5px 9px; font-size:11.5px; }
    #sideToggle, #routineBtn { display:none; }
  }
  @media (max-width:600px){
    .cal-nav { gap:4px; padding:6px 7px; }
    .nav-btn { padding:5px 7px; font-size:11px; }
    .segb { padding:5px 8px; font-size:11px; }
    .cal-nav .title { font-size:12.5px; flex-basis:100%; order:-1; }
    .nav-spacer { display:none; }
    .day-modal, .pop, .routine-modal, .modal { max-width:calc(100vw - 20px); }
  }

  /* ===== 日付へ移動：1か月のカレンダー ===== */
  .mp-ov { position:fixed; inset:0; z-index:140; display:none; background:rgba(15,25,50,.18); }
  .mp-ov.open { display:block; }
  .mp {
    position:absolute; width:276px; background:#fff; padding:11px;
    border:1px solid var(--border); border-radius:12px;
    box-shadow:0 12px 36px rgba(20,40,90,.26);
    max-height:calc(100vh - 16px); overflow-y:auto;
  }
  .mp-head { display:flex; align-items:center; gap:6px; margin-bottom:9px; }
  .mp-head .t { flex:1; text-align:center; font-size:13.5px; font-weight:700; }
  .mp-nav {
    width:28px; height:28px; flex:none; font:inherit; font-size:11px; cursor:pointer;
    border:1px solid var(--border); background:#fff; border-radius:8px; color:var(--text);
  }
  .mp-nav:hover { border-color:var(--accent); color:var(--accent); }
  .mp-dows, .mp-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .mp-dows div { text-align:center; font-size:10px; color:var(--muted); padding:2px 0; }
  .mp-dows div.sun { color:#c83030; } .mp-dows div.sat { color:var(--accent); }
  .mp-d {
    position:relative; height:33px; border:0; background:#fff; border-radius:8px;
    font:inherit; font-size:12.5px; color:var(--text); cursor:pointer; padding:0;
  }
  .mp-d:hover  { background:var(--accent-soft); }
  .mp-d.out    { color:#c8d0dc; }
  .mp-d.inview { background:#e2ecff; font-weight:700; }
  .mp-d.today  { box-shadow:inset 0 0 0 2px var(--accent); font-weight:700; }
  .mp-d.sun    { color:#c83030; }
  .mp-d.sat    { color:var(--accent); }
  .mp-d.out.sun, .mp-d.out.sat { color:#c8d0dc; }
  .mp-d .dotm {
    position:absolute; left:50%; bottom:4px; transform:translateX(-50%);
    width:4px; height:4px; border-radius:50%; background:var(--accent); opacity:.75;
  }
  .mp-foot { display:flex; gap:6px; margin-top:9px; }
  .mp-foot button {
    flex:1; font:inherit; font-size:12px; padding:7px 0; cursor:pointer;
    border:1px solid var(--border); background:#fff; border-radius:8px; color:var(--text);
  }
  .mp-foot button:hover { border-color:var(--accent); color:var(--accent); }
  .mp-hint { font-size:10.5px; color:var(--muted); text-align:center; margin-top:7px; }
  .cal-pill {
    font-size:11px; line-height:1.25; padding:3px 6px; border-radius:5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:#fff; cursor:pointer; flex:none;
  }
  .cal-pill:hover { filter:brightness(1.1); }
  .cal-pill.todo    { background:var(--todo); }
  .cal-pill.doing   { background:var(--doing); }
  .cal-pill.done    { background:var(--done); opacity:.7; }
  .cal-pill.overdue { background:var(--overdue); }
  .cal-pill.soon    { background:var(--soon); }
  .cal-pill.recur   { border-left:3px solid rgba(255,255,255,.5); }
  .cal-more { font-size:11px; color:var(--muted); padding-left:3px; }

  /* ===== 選択バー ===== */
  .sel-bar {
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:#1d2535; color:#fff; border-radius:14px;
    padding:11px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 8px 30px rgba(10,20,60,.28); z-index:90; white-space:nowrap;
    animation:slideUpBar .18s ease;
  }
  .sel-bar.hidden { display:none; }
  @keyframes slideUpBar { from { transform:translateX(-50%) translateY(16px); opacity:0; } to { transform:translateX(-50%); opacity:1; } }
  .sel-bar .sel-count { font-size:14px; font-weight:700; }
  .sel-bar .sel-dates { font-size:12px; opacity:.72; max-width:200px; overflow:hidden; text-overflow:ellipsis; }
  .sel-bar button { padding:7px 13px; border-radius:9px; border:none; cursor:pointer; font-size:13px; font-weight:600; }
  .sel-bar .btn-clear { background:rgba(255,255,255,.15); color:#fff; }
  .sel-bar .btn-clear:hover { background:rgba(255,255,255,.25); }
  .sel-bar .btn-add   { background:var(--accent); color:#fff; }
  .sel-bar .btn-add:hover { background:#2f5ec0; }

  /* ===== OVERLAY ===== */
  .overlay {
    display:none; position:fixed; inset:0;
    background:rgba(15,25,50,.45); z-index:100;
    align-items:center; justify-content:center; padding:16px;
  }
  .overlay.open { display:flex; }
  @keyframes slideUp { from{transform:translateY(14px);opacity:0} to{transform:none;opacity:1} }

  /* ===== タスクモーダル ===== */
  .modal {
    background:#fff; border-radius:16px; width:440px; max-width:100%;
    box-shadow:0 20px 60px rgba(20,40,100,.22); animation:slideUp .16s ease; overflow:hidden;
  }
  .modal-head {
    background:linear-gradient(120deg,#2c5cc5,#4a83e0); color:#fff;
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h3 { font-size:15px; font-weight:700; }
  .m-close {
    background:rgba(255,255,255,.2); border:none; color:#fff; border-radius:50%;
    width:27px; height:27px; font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .m-close:hover { background:rgba(255,255,255,.35); }
  .modal-body { padding:16px 18px 10px; max-height:70vh; overflow-y:auto; }
  .modal-body::-webkit-scrollbar { width:5px; }
  .modal-body::-webkit-scrollbar-thumb { background:#d4dae3; border-radius:5px; }

  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:5px; }
  .field input,.field select,.field textarea {
    width:100%; border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; font-size:14px; font-family:inherit; color:var(--text); background:#fff;
    transition:border-color .12s,box-shadow .12s;
  }
  .field input:focus,.field select:focus,.field textarea:focus {
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
  }
  .field textarea { resize:vertical; min-height:52px; }

  /* 複数日 */
  .dates-area { margin-bottom:12px; }
  .dates-area label { display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:5px; }
  .dates-chips {
    display:flex; flex-wrap:wrap; gap:5px; padding:6px 8px;
    border:1px solid var(--border); border-radius:8px; min-height:38px; background:#fff;
    transition:border-color .12s,box-shadow .12s;
  }
  .date-chip {
    display:flex; align-items:center; gap:4px;
    background:var(--accent-soft); color:var(--accent);
    border:1px solid #b0c8f8; border-radius:14px; padding:3px 8px;
    font-size:12px; font-weight:600;
  }
  .date-chip .rm { background:none; border:none; color:#7098d8; cursor:pointer; font-size:12px; padding:0; line-height:1; }
  .date-chip .rm:hover { color:var(--overdue); }
  .no-date-msg { font-size:12px; color:#b0b8c4; align-self:center; padding:2px; }
  .date-add-row { display:flex; gap:6px; margin-top:5px; }
  .date-add-row input { flex:1; }
  .date-add-row button {
    padding:7px 11px; border-radius:7px; border:1px solid var(--border);
    background:#f0f3f8; cursor:pointer; font-size:13px; font-weight:600; color:var(--text);
    white-space:nowrap;
  }
  .date-add-row button:hover { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  /* 色スウォッチ */
  .color-swatches { display:flex; flex-wrap:wrap; gap:7px; padding:4px 0; }
  .color-swatch {
    width:26px; height:26px; border-radius:50%; cursor:pointer; flex:none;
    border:2px solid rgba(0,0,0,.12); transition:transform .12s, box-shadow .12s;
  }
  .color-swatch:hover { transform:scale(1.2); }
  .color-swatch.active { box-shadow:0 0 0 2px #fff,0 0 0 4px #3b6fd6; }
  .cs-default { background:linear-gradient(135deg,#8fa0b8 50%,#e69520 50%); }

  /* 曜日トグル（共通） */
  .dow-tog-row { display:flex; gap:5px; flex-wrap:wrap; }
  .dow-tog {
    width:34px; height:32px; border:1px solid var(--border); border-radius:8px;
    background:#f5f6f8; color:var(--muted); font-size:13px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .12s; user-select:none;
  }
  .dow-tog:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .dow-tog.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .dow-tog.sun.active { background:#c83030; border-color:#c83030; }
  .dow-tog.sat.active { background:#3b6fd6; border-color:#3b6fd6; }

  .modal-foot { padding:10px 18px 16px; display:flex; gap:8px; }
  .mfbtn {
    flex:1; padding:10px; border-radius:9px; font-size:14px; font-weight:600;
    cursor:pointer; border:1px solid var(--border); background:#f0f3f8; color:var(--text);
  }
  .mfbtn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .mfbtn.primary:hover { background:#2f5ec0; }
  .mfbtn.del { background:#fff2f2; color:var(--overdue); border-color:#f3c2c2; }
  .mfbtn.del:hover { background:#ffe4e4; }
  .mfbtn:hover { background:var(--accent-soft); }

  /* ===== ルーチン一括モーダル ===== */
  .routine-modal {
    background:#fff; border-radius:16px; width:680px; max-width:100%;
    max-height:90vh; box-shadow:0 20px 60px rgba(20,40,100,.22);
    animation:slideUp .16s ease; display:flex; flex-direction:column;
  }
  .routine-head {
    background:linear-gradient(120deg,#5b2fa0,#8a5cd0); color:#fff;
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
    border-radius:16px 16px 0 0; flex:none;
  }
  .routine-head h3 { font-size:15px; font-weight:700; }
  .routine-hint {
    font-size:12px; color:var(--muted); background:#f8f0ff; border:1px solid #dcc8f8;
    border-radius:8px; padding:7px 12px; margin:12px 18px 4px;
    flex:none;
  }
  .routine-body { flex:1; overflow-y:auto; padding:8px 18px 14px; }
  .routine-body::-webkit-scrollbar { width:5px; }
  .routine-body::-webkit-scrollbar-thumb { background:#d4dae3; border-radius:5px; }

  /* 行ヘッダ */
  .rr-header {
    display:grid; grid-template-columns:1fr auto auto;
    gap:10px; align-items:center; padding:0 4px 6px;
    font-size:11px; font-weight:700; color:var(--muted);
    border-bottom:1px solid var(--border); margin-bottom:6px;
  }

  /* 1行 */
  .rr {
    background:#fafbfd; border:1px solid var(--border); border-radius:10px;
    margin-bottom:8px; padding:10px 12px; transition:border-color .12s;
  }
  .rr:focus-within { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .rr-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .rr-name {
    flex:1; border:1px solid var(--border); border-radius:7px;
    padding:7px 9px; font-size:13px; font-family:inherit; color:var(--text);
    background:#fff;
  }
  .rr-name:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .rr-rm {
    width:26px; height:26px; border-radius:50%; border:1px solid var(--border);
    background:#f5f6f8; cursor:pointer; color:var(--muted);
    font-size:13px; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .rr-rm:hover { background:#ffe4e4; border-color:#f3c2c2; color:var(--overdue); }
  .rr-bot { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .rr-dows { display:flex; gap:4px; }
  .rr-dows .dow-tog { width:30px; height:28px; font-size:12px; border-radius:7px; }
  .rr-st {
    border:1px solid var(--border); border-radius:7px; padding:5px 8px;
    font-size:13px; font-family:inherit; color:var(--text); background:#fff;
    cursor:pointer;
  }
  .rr-note {
    width:100%; margin-top:8px; border:1px solid var(--border); border-radius:7px;
    padding:5px 9px; font-size:12px; font-family:inherit; color:var(--text); background:#fff;
    resize:none; min-height:0; display:none;
  }
  .rr-note:focus { outline:none; border-color:var(--accent); }
  .rr-note-btn {
    font-size:11px; color:var(--accent); background:none; border:none;
    cursor:pointer; padding:0; text-decoration:underline;
  }

  .add-row-btn {
    width:100%; padding:9px; border-radius:9px; border:2px dashed var(--border);
    background:transparent; cursor:pointer; color:var(--muted); font-size:13px;
    font-weight:600; margin-top:4px; transition:all .12s;
  }
  .add-row-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }

  .routine-foot { padding:10px 18px 16px; border-top:1px solid var(--border); display:flex; gap:8px; flex:none; }

  /* ===== 日付詳細モーダル ===== */
  .day-modal {
    background:#fff; border-radius:16px; width:460px; max-width:100%; max-height:80vh;
    display:flex; flex-direction:column;
    box-shadow:0 20px 60px rgba(20,40,100,.22); animation:slideUp .16s ease;
  }
  .day-modal-head {
    background:linear-gradient(120deg,#2c5cc5,#4a83e0); color:#fff;
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
    border-radius:16px 16px 0 0; flex:none;
  }
  .day-modal-body { padding:12px; overflow-y:auto; flex:1; }
  .day-row {
    display:flex; align-items:center; gap:9px; padding:9px 11px;
    border:1px solid var(--border); border-left:3px solid var(--todo);
    border-radius:8px; margin-bottom:7px; cursor:pointer;
  }
  .day-row:hover { background:var(--accent-soft); }
  .day-row.doing   { border-left-color:var(--doing); }
  .day-row.done    { border-left-color:var(--done); }
  .day-row.overdue { border-left-color:var(--overdue); background:#fff7f7; }
  .day-row .dname  { flex:1; font-size:14px; font-weight:600; }
  .day-row.done .dname { text-decoration:line-through; color:var(--muted); }
  .day-modal-foot { padding:10px 14px 14px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px; flex:none; }
  .day-bulk-row { display:flex; align-items:center; gap:6px; }
  .day-bulk-label { font-size:12px; color:var(--muted); white-space:nowrap; flex:none; }
  .day-bulk-date {
    flex:1; border:1px solid var(--border); border-radius:8px; padding:7px 9px;
    font-size:13px; font-family:inherit; color:var(--text); min-width:0;
  }
  .day-bulk-date:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }

  /* ===== 担当者・進捗・経過時間（2026-08-18 追加） ===== */
  .num { font-variant-numeric:tabular-nums; }
  .av {
    width:22px; height:22px; border-radius:50%; flex:none;
    font-size:12px; font-weight:800; line-height:1; letter-spacing:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .av-sm { width:18px; height:18px; font-size:11px; }
  .av-x { background:#6b7686; }
  .av-F { background:#2f6fd0; }
  .av-S { background:#12916a; }
  .av-T { background:#d2603a; }
  /* カレンダーの札の上では白抜きにして、色付きの札からくっきり浮かせる */
  .cal-pill .av { background:#fff !important; box-shadow:0 0 0 1px rgba(0,0,0,.12); }
  .cal-pill .av-x { color:#4d5666; }
  .cal-pill .av-F { color:#1f5cb8; }
  .cal-pill .av-S { color:#0b7a57; }
  .cal-pill .av-T { color:#b94c28; }

  .cal-pill { position:relative; display:flex; align-items:center; gap:4px; overflow:hidden; }
  .pill-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill-prog { position:absolute; left:0; bottom:0; height:2px; background:rgba(255,255,255,.9); }

  /* 対応中はひと目で分かるように：点滅する丸＋経過時間＋白フチ */
  .cal-pill.doing {
    background:var(--doing); font-weight:700;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.7), 0 1px 4px rgba(214,140,20,.5);
  }
  .cal-pill.soon { background:#f0c469; color:#5b3d05; }   /* 進行中の濃いオレンジと区別 */
  /* 中断中：未着手のグレーとも対応中のオレンジとも違う紫にして取り違えないようにする */
  .cal-pill.paused { background:#8b7fc0; color:#fff; }
  /* 共通タスクの未着手は色を付けない（毎日並ぶので画面を静かに保つ） */
  .cal-pill.plain { background:#fff; color:var(--text); box-shadow:inset 0 0 0 1px var(--border); }
  .cal-pill.plain:hover { filter:none; background:#f6f8fb; }
  /* 白など明るい色を選んだ札：文字と中のバッジを濃くして読めるようにする */
  .cal-pill.light { color:var(--text); box-shadow:inset 0 0 0 1px var(--border); }
  .cal-pill.light:hover { filter:brightness(.97); }
  .cal-pill.plain .pill-el, .cal-pill.light .pill-el { background:rgba(0,0,0,.07); }
  .cal-pill.plain .pill-live, .cal-pill.light .pill-live { background:var(--doing); }
  .cal-pill.plain .who-chip, .cal-pill.light .who-chip { box-shadow:0 0 0 1px rgba(0,0,0,.15); }
  .cal-pill.plain .av, .cal-pill.light .av { box-shadow:0 0 0 1px rgba(0,0,0,.18); }
  .pill-live {
    width:6px; height:6px; border-radius:50%; background:#fff; flex:none;
    animation:pulseDot 1.4s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }
  .pill-el {
    flex:none; font-size:10px; line-height:1.4; padding:1px 4px; border-radius:4px;
    background:rgba(255,255,255,.3); font-weight:700; font-variant-numeric:tabular-nums;
    display:inline-flex; align-items:center; gap:3px;
  }
  /* 完了した人を丸で強調 */
  .who-chip {
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    width:16px; height:16px; border-radius:50%;
    font-size:10px; font-weight:800; color:#fff; line-height:1;
    box-shadow:0 0 0 1px rgba(255,255,255,.85);
  }
  .pw-x { background:#4d5666; } .pw-F { background:#2f6fd0; }
  .pw-S { background:#12916a; } .pw-T { background:#d2603a; }
  @media (prefers-reduced-motion:reduce){ .pill-live{ animation:none } }
  /* 取り消し線はタスク名だけに掛ける。
     親に掛けると担当者の丸や作業時間まで線が貫いてしまうため。 */
  .cal-pill.done .pill-name { text-decoration:line-through; }
  .cal-pill.done { opacity:.85; }
  .cal-pill.done .pill-el { background:rgba(255,255,255,.4); }

  .dayhead2 {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:0 4px 9px; border-bottom:1px solid var(--border); margin-bottom:2px;
  }
  .dayhead2 .lbl { font-size:12px; color:var(--muted); }
  .dtrack { width:88px; height:5px; background:#e6eaf1; border-radius:3px; overflow:hidden; }
  .dfill  { height:100%; background:var(--done); transition:width .25s; }
  .dpct   { font-size:12px; color:var(--muted); min-width:36px; text-align:right; }

  .d2row  { padding:11px 4px; border-bottom:1px solid var(--border); }
  .d2row:last-child { border-bottom:0; }
  .d2top  { display:flex; align-items:center; gap:9px; }
  /* ▲▼ で順番を入れ替える */
  .ord { display:flex; flex-direction:column; align-items:center; gap:3px; flex:none; }
  .ord-ar { display:flex; gap:2px; }
  .drag-h {
    cursor:grab; font-size:13px; line-height:1; color:#b6bfcc;
    user-select:none; padding:1px 4px; border-radius:4px;
  }
  .drag-h:hover { color:var(--accent); background:var(--accent-soft); }
  .drag-h:active { cursor:grabbing; }
  .d2row.dragging { opacity:.35; }
  .d2row.drop-hi { box-shadow:inset 0 3px 0 var(--accent); background:var(--accent-soft); }
  .ordbtn {
    font:inherit; font-size:9px; line-height:1; width:17px; height:15px;
    border:1px solid var(--border); background:#fff; color:var(--muted);
    border-radius:4px; cursor:pointer; padding:0;
  }
  .ordbtn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .ordbtn:disabled { opacity:.28; cursor:default; }
  .d2name {
    flex:1; min-width:0; font:inherit; font-size:14px; font-weight:600; text-align:left;
    background:none; border:0; padding:0; color:var(--text); cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .d2name:hover { color:var(--accent); }
  .d2name.off   { color:var(--muted); text-decoration:line-through; }
  .d2tag  { font-size:11px; padding:4px 9px; border-radius:6px; flex:none; white-space:nowrap; }
  .d2tag.todo  { background:#eef1f6; color:#5b6472; }
  .d2tag.doing { background:#fdf0d8; color:#8a5a08; }
  .d2tag.paused{ background:#eeebf9; color:#4a3f86; }
  .d2tag.done  { background:#e2f0e8; color:#1d6642; }
  .d2go {
    font:inherit; font-size:11px; padding:4px 11px; border-radius:6px;
    border:1px solid var(--border); background:#fff; color:var(--text);
    cursor:pointer; white-space:nowrap;
  }
  .d2go:hover { border-color:var(--accent); color:var(--accent); }
  .d2bot { display:flex; align-items:center; gap:9px; padding-left:29px; margin-top:7px; }
  .d2bot input[type=range] { flex:1; min-width:0; accent-color:var(--done); height:18px; margin:0; cursor:pointer; }
  .d2pv  { font-size:12px; color:var(--muted); min-width:36px; text-align:right; }
  .d2sub { font-size:11px; color:var(--muted); padding-left:29px; margin-top:3px; }

  .pop-ov {
    position:fixed; inset:0; background:rgba(15,25,50,.5); z-index:130;
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  .pop-ov.open { display:flex; }
  .pop { width:100%; max-width:380px; background:#fff; border-radius:14px; padding:16px 18px 18px; max-height:88vh; overflow-y:auto; }
  .pophead { display:flex; align-items:center; gap:9px; }
  .pophead h4 { flex:1; min-width:0; font-size:15px; font-weight:700; }
  .popnote {
    font-size:13px; color:var(--muted); line-height:1.8; white-space:pre-wrap;
    margin:11px 0 13px; padding-bottom:13px; border-bottom:1px solid var(--border);
  }
  .popsl { display:flex; align-items:center; gap:10px; margin-bottom:13px; }
  .popsl label { font-size:12px; color:var(--muted); flex:none; }
  .popsl input[type=range] { flex:1; min-width:0; accent-color:var(--done); }
  .popfact { display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:3px 0; }
  .popfact b { font-weight:600; }
  .popfact .k { color:var(--muted); }
  /* 誰が何分やったかの一覧 */
  .wlist { margin-top:10px; padding-top:9px; border-top:1px solid var(--border); }
  .wlist-h { font-size:11px; color:var(--muted); margin-bottom:5px; }
  .wrow { display:flex; align-items:center; gap:7px; font-size:12.5px; padding:3px 0; }
  .wrow .wn { font-weight:600; }
  .wrow .wt { margin-left:auto; font-variant-numeric:tabular-nums; }
  .wrow .wst { font-size:10px; font-weight:700; border-radius:4px; padding:1px 6px; }
  .wrow .is-doing { color:#8a5a08; background:#fdf0d8; }
  .wrow .is-pause { color:#4a3f86; background:#eeebf9; }
  .wrow .is-done  { color:#1d6642; background:#e2f0e8; }
  .d2go.fin { background:#e2f0e8; border-color:#a8dfc0; color:#1d6642; font-weight:700; }
  .popact {
    font:inherit; font-size:13.5px; width:100%; margin-top:14px; padding:10px 0;
    border-radius:9px; border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer;
  }
  .popact:hover { border-color:var(--accent); }
  .popact.fin { background:var(--done); border-color:var(--done); color:#fff; font-weight:700; }
  .popact.fin:hover { filter:brightness(1.06); }
  .popact.go { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700; }

  .own-row { display:flex; gap:6px; flex-wrap:wrap; }
  .own-btn {
    font:inherit; font-size:13px; padding:6px 13px; border-radius:8px;
    border:1px solid var(--border); background:#fff; color:var(--muted);
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .own-btn.active { border-color:var(--accent); color:var(--text); font-weight:700; background:var(--accent-soft); }
</style>
</head>
<body>

<!-- ▼ ログイン（2026-08-18 追加）：許可されたGoogleアカウントだけが中に入れる -->
<div id="authGate" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#4a5568,#2d3748);display:flex;align-items:center;justify-content:center;font-family:inherit">
  <div style="background:#fff;border-radius:16px;padding:36px 34px;max-width:400px;width:calc(100% - 40px);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center">
    <div style="font-size:34px;margin-bottom:6px">📋</div>
    <h2 style="margin:0 0 6px;font-size:19px;color:#2d3748">業務管理カレンダー</h2>
    <p id="authMsg" style="margin:0 0 22px;font-size:13px;color:#718096;line-height:1.7">
      スタッフ用です。<br>Googleアカウントでログインしてください。
    </p>
    <button id="authBtn" style="width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5e0;background:#fff;color:#2d3748;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">
      Google でログイン
    </button>
    <div id="authBusy" style="margin-top:14px;font-size:12px;color:#a0aec0" hidden>確認しています…</div>
  </div>
</div>

<header>
  <div>
    <h1>📋 業務管理カレンダー</h1>
    <p>日付を選択してタスク追加 ／ 曜日繰り返し ／ ルーチン一括登録</p>
  </div>
  <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
    <button id="exportBtn" style="padding:6px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap">📤 エクスポート</button>
    <button id="importBtn" style="padding:6px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap">📥 インポート</button>
    <span id="whoChip" style="padding:6px 11px;border-radius:8px;background:rgba(255,255,255,.28);color:#fff;font-size:12px;font-weight:700;white-space:nowrap"></span>
    <button id="logoutBtn" style="padding:6px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap">ログアウト</button>
  </div>
</header>
<input type="file" id="importFile" accept=".json" style="display:none">

<div class="summary-bar" id="summaryBar"></div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-head">
      <h2>タスク一覧 <span id="sideCount" style="font-size:12px;color:var(--muted);font-weight:400;"></span></h2>
      <select class="sort-sel" id="sideSort">
        <option value="deadline">締切日順</option>
        <option value="status">ステータス順</option>
        <option value="name">名前順</option>
        <option value="created">登録順</option>
        <option value="manual">手動</option>
      </select>
    </div>
    <div class="filters" id="filters">
      <span class="chip active" data-f="all">すべて</span>
      <span class="chip" data-f="todo">未着手</span>
      <span class="chip" data-f="doing">進行中</span>
      <span class="chip" data-f="done">完了</span>
      <span class="chip" data-f="overdue">要対応</span>
      <span class="chip" data-f="recur">🔁 繰り返し</span>
    </div>
    <div class="filters owners" id="ownerFilters">
      <span class="chip active" data-o="any">全員</span>
      <span class="chip" data-o=""><span class="av av-sm av-x">共</span>共通</span>
      <span class="chip" data-o="T"><span class="av av-sm av-T">T</span></span>
      <span class="chip" data-o="S"><span class="av av-sm av-S">S</span></span>
      <span class="chip" data-o="F"><span class="av av-sm av-F">F</span></span>
    </div>
    <div class="task-scroll" id="taskScroll"></div>
  </div>

  <div class="cal-main">
    <div class="cal-nav">
      <button class="nav-btn" id="sideToggle" title="タスク一覧の表示／非表示">☰ 一覧</button>
      <button class="nav-btn" id="prevBtn">◀</button>
      <div class="title" id="calTitle"></div>
      <button class="nav-btn" id="nextBtn">▶</button>
      <button class="nav-btn" id="todayBtn">今日</button>
      <span class="seg">
        <button class="segb active" data-mode="week">1週間</button>
        <button class="segb" data-mode="month">1か月</button>
      </span>
      <button class="nav-btn" id="jumpBtn" title="カレンダーから日付を選ぶ">📅 日付へ移動</button>
      <button class="nav-btn" id="mobileToggle" title="スマホ向けの表示に切り替え">📱 スマホ</button>

<!-- Firebase（compat版：アプリ全体が通常スクリプトのため module 版は使わない） -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
(function(){
"use strict";
const KEY = "shigotoCalV3";
const SL  = { todo:"未着手", doing:"進行中", done:"完了" };
const DOWS = ["日","月","火","水","木","金","土"];

/* ===== STATE ===== */
let tasks       = loadTasks();

let viewDate    = new Date();          // 表示している期間の基準日
let viewMode    = "week";              // "week" = 1週間 / "month" = 1か月
let sideOpen    = true;                // 左のタスク一覧を開いているか
let mobileMode  = false;               // スマホ向けの縦並び表示にするか
let jumpTarget  = null;                // 「日付へ移動」で指定した日（描画後にそこへスクロールする）
try{
  const vm=localStorage.getItem("calViewMode");
  if(vm==="week"||vm==="month") viewMode=vm;
  const so=localStorage.getItem("calSideOpen");
  sideOpen = so===null ? (window.innerWidth>=1500) : (so==="1");
  const mb=localStorage.getItem("calMobile");
  mobileMode = mb===null ? (window.innerWidth<820) : (mb==="1");
}catch(e){ mobileMode = window.innerWidth<820; }
let selected    = new Set();
let lastClicked = null;
let sideFilter  = "all";
let sideOwner   = "any";               // 一覧の担当者しぼり込み： any / "" / T / S / F
let sideSort    = "deadline";
let editingId   = null;
let modalDates  = [];
let modalDows   = [];
let modalColor  = "";
let modalOwner  = "";
let currentDay  = "";

/* ===== STORAGE（2026-08-18：localStorage → Firebase 共有DB） =====
   ・save() の中身だけ差し替え。呼び出し側11箇所は無改修。
   ・全件 set() ではなく「変わったタスクだけ update()」＝
     3人が同時に触っても、あとから保存した人が相手の変更を消さない。            */

/* ▼▼ ここに Firebase コンソールの firebaseConfig を貼る ▼▼ */
const FB_CFG = {
  apiKey:            "AIzaSyClxo50mLDpxMWTje3do38r-SEyHuLN3Hg",
  authDomain:        "scissors-task-calendar.firebaseapp.com",
  databaseURL:       "https://scissors-task-calendar-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "scissors-task-calendar",
  storageBucket:     "scissors-task-calendar.firebasestorage.app",
  messagingSenderId: "144314796212",
  appId:             "1:144314796212:web:7993187057683090f8afe1"
};
/* ▲▲ ここまで ▲▲ */

let fbDb = null, tasksRef = null;
let myName = "";                 // F / S / T
let _lastSaved = {};             // id -> JSON文字列（差分の判定用）
let _applyingRemote = false;     // 受信を反映している最中は保存しない

/* Firebaseは空配列を保存できず消えるので、読み出し時に必ず配列へ戻す */
function toArr(v){
  if (Array.isArray(v)) return v.slice();
  if (v && typeof v === "object") return Object.values(v);
  return [];
}
function normalizeTask(t){
  if (!t.dates && t.date) { t.dates = [t.date]; delete t.date; }
  t.dates          = toArr(t.dates);
  t.daysOfWeek     = toArr(t.daysOfWeek);
  t.completedDates = toArr(t.completedDates);
  t.skipDates      = toArr(t.skipDates);
  if (t.color === undefined)       t.color = "";
  if (t.note === undefined)        t.note = "";
  if (t.processedBy === undefined) t.processedBy = "";
  if (t.owner === undefined)       t.owner = "";          // "" = 共通 / F / S / T
  if (t.order !== undefined && typeof t.order !== "number") t.order = Number(t.order)||0;
  if (!t.dayLog || typeof t.dayLog !== "object" || Array.isArray(t.dayLog)) t.dayLog = {};
  return t;
}

/* 起動時は空。実データは onValue で流し込む */
function loadTasks(){ return []; }

function save(){
  if (!tasksRef || _applyingRemote) return;
  const updates = {}, now = {};
  tasks.forEach(t => {
    normalizeTask(t);
    const prev = _lastSaved[t.id] ? JSON.parse(_lastSaved[t.id]) : null;
    /* 対応中／完了に「変わった瞬間」に、やった人を記録する */
    if (myName && (t.status === "doing" || t.status === "done")
        && (!prev || prev.status !== t.status)) {
      t.processedBy = myName;
    }
    const j = JSON.stringify(t);
    now[t.id] = j;
    if (_lastSaved[t.id] !== j) updates[t.id] = t;
  });
  Object.keys(_lastSaved).forEach(id => { if (!(id in now)) updates[id] = null; });  // 削除
  _lastSaved = now;
  if (!Object.keys(updates).length) return;
  tasksRef.update(updates).catch(e => {
    console.error("保存エラー", e);
    alert("保存できませんでした。通信状態を確認してください。（画面の内容はまだ反映されていません）");
  });
}

/* 誰かが変えたら全員の画面に反映される */
function startSync(){
  tasksRef.on("value", snap => {
    const v = snap.val() || {};
    _applyingRemote = true;
    tasks = Object.keys(v).map(id => normalizeTask(Object.assign({}, v[id], { id: id })));
    ensureOrders();
    tasks.sort(byOrder);
    _lastSaved = {};
    tasks.forEach(t => { _lastSaved[t.id] = JSON.stringify(t); });
    _applyingRemote = false;
    renderAll();
  }, err => {
    console.error(err);
    alert("データを読み込めませんでした。権限を確認してください。");
  });
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ===== DATE UTILS ===== */
function startOfMonth(d){ return new Date(d.getFullYear(),d.getMonth(),1); }
function ymd(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function todayStr(){ return ymd(new Date()); }
function parse(s){ const[y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function daysUntil(s){ return s?Math.round((parse(s)-parse(todayStr()))/86400000):null; }
function fmtDate(s){
  if(!s) return "締切なし";
  const d=parse(s),w=DOWS[d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${w})`;
}
function fmtDateLong(s){
  const d=parse(s),w=DOWS[d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${w})`;
}
function fmtDows(arr){
  if(!arr||!arr.length) return "";
  return "毎週"+[1,2,3,4,5,6,0].filter(d=>arr.includes(d)).map(d=>DOWS[d]).join("・");
}
function esc(s){ return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ===== URGENCY ===== */
function urgency(t){
  if(t.status==="done"||!t.dates.length) return null;
  const n=t.dates.map(daysUntil).sort((a,b)=>a-b)[0];
  if(n<0)  return "overdue";
  if(n<=2) return "soon";
  return null;
}
function isDayCompleted(t, dateStr){
  return !!(t.completedDates && t.completedDates.includes(dateStr));
}
function pillCls(t, dateStr){
  const s=dayState(t,dateStr).s;
  if(s==="done")   return "done";
  if(s==="doing")  return "doing";    // 対応中は期限の色より優先（埋もれないように）
  if(s==="paused") return "paused";
  const u=urgency(t);
  if(u==="overdue") return "overdue";                       // 期限切れの赤だけは共通でも出す
  if(s==="todo" && !ownerOf(t)) return "plain";             // 共通の未着手は色なし
  if(u==="soon")    return "soon";
  return s;
}
function isRecur(t){ return t.daysOfWeek&&t.daysOfWeek.length>0; }

/* ===== 日ごとの状態（2026-08-18 追加） =====
   1つのタスクが複数の日に出るため、ステータス・進捗・開始時刻は日付ごとに持つ。
   dayLog["2026-08-19"] = { p:進捗%, s:状態, a:動き出した時刻, acc:積み上げた時間, d:完了時刻, by:操作した人 }
   s は todo / doing / paused / done。
   古いタスクには dayLog が無いので、その場合は従来の項目から組み立てる。       */
function dayState(t, ds){
  const L = t.dayLog && ds ? t.dayLog[ds] : null;
  if(L) return { p:Number(L.p)||0, s:L.s||"todo", a:Number(L.a)||0,
                 acc:Number(L.acc)||0, d:Number(L.d)||0, by:L.by||"",
                 s0:Number(L.s0)||0, sb:L.sb||"",
                 who:(L.who&&typeof L.who==="object"&&!Array.isArray(L.who))?L.who:null };
  if(isRecur(t)) return isDayCompleted(t,ds)
    ? { p:100, s:"done", a:0, acc:0, d:0, by:t.processedBy||"", s0:0, sb:"", who:null }
    : { p:0,   s:"todo", a:0, acc:0, d:0, by:"", s0:0, sb:"", who:null };
  return { p:(t.status==="done"?100:0), s:t.status||"todo", a:0, acc:0, d:0,
           by:(t.status!=="todo" ? (t.processedBy||"") : ""), s0:0, sb:"", who:null };
}
function setDayState(t, ds, patch){
  if(!t.dayLog) t.dayLog={};
  const n=Object.assign({}, dayState(t,ds), patch);
  t.dayLog[ds]={ p:n.p, s:n.s, a:n.a, acc:n.acc||0, d:n.d, by:n.by,
                 s0:n.s0||0, sb:n.sb||"", who:n.who||null };
  /* 従来の項目とも同期させる（サイドバー・集計・繰り返しの完了判定がこれを見ているため）
     中断中は従来の項目では「進行中」として扱う */
  if(isRecur(t)){
    if(!t.completedDates) t.completedDates=[];
    const i=t.completedDates.indexOf(ds);
    if(n.s==="done" && i===-1) t.completedDates.push(ds);
    if(n.s!=="done" && i!==-1) t.completedDates.splice(i,1);
  } else {
    t.status = (n.s==="paused") ? "doing" : n.s;
  }
  if(n.by) t.processedBy=n.by;
}
/* 作業開始 → 一時停止 → 再開 → 完了。
   acc に「止めるまでに積み上げた時間」を貯め、a は今回動き出した時刻。
   対応中のときだけ a からの経過を足すので、止めている間は時間が進まない。 */
/* ===== 複数人での作業（2026-08-25 追加） =====
   who = { "T":{s:"doing",a:動き出した時刻,acc:積み上げ}, "S":{...} }
   共通タスクを2人以上で同時に進められるように、人ごとに時計を持つ。
   who が無い古いデータは、これまでどおり1人ぶんとして読む。            */
function whoMap(st){
  if(st.who) return st.who;
  if(st.acc||st.a){                       // 古い形式を1人ぶんとして読む
    const k=st.by||"—";
    const o={}; o[k]={ s:(st.s==="doing"?"doing":"paused"), a:st.a||0, acc:st.acc||0 };
    return o;
  }
  return {};
}
function pElapsed(p){
  const acc=Number(p&&p.acc)||0;
  return (p&&p.s==="doing"&&p.a) ? acc+Math.max(0,Date.now()-Number(p.a)) : acc;
}
/* その日の合計作業時間（全員ぶんを足す） */
function elapsedMs(st){
  const w=whoMap(st), names=Object.keys(w);
  if(!names.length) return 0;
  return names.reduce((sum,n)=>sum+pElapsed(w[n]),0);
}
/* いま動いている人 */
function activeWorkers(st){
  const w=whoMap(st);
  return Object.keys(w).filter(n=>w[n].s==="doing");
}
/* 作業に関わった人（時間の多い順） */
function workers(st){
  const w=whoMap(st);
  return Object.keys(w).filter(n=>pElapsed(w[n])>0||w[n].s==="doing"||w[n].s==="done")
    .sort((a,b)=>pElapsed(w[b])-pElapsed(w[a]));
}
/* 人の状態から、その日全体の状態を決め直す。
   人の状態は todo / doing（作業中）/ paused（中断）/ done（自分の分は終わり） */
function rollUp(st){
  if(st.d) return "done";
  const w=whoMap(st), names=Object.keys(w);
  if(!names.length) return "todo";
  if(names.some(n=>w[n].s==="doing")) return "doing";
  if(names.every(n=>w[n].s==="done")) return "done";     // 全員が自分の分を終えた
  if(names.some(n=>(Number(w[n].acc)||0)>0)) return "paused";
  return "todo";
}
function applyWho(t, ds, name, mut){
  const st=dayState(t,ds);
  const w=Object.assign({}, whoMap(st));
  const cur=Object.assign({ s:"todo", a:0, acc:0 }, w[name]||{});
  w[name]=mut(cur);
  const next={ who:w, acc:0, a:0 };        // 合計は who から出すので、旧項目は使わない
  const someoneDoing=Object.keys(w).some(n=>w[n].s==="doing");
  next.d = someoneDoing ? 0 : (st.d||0);   // 誰かが動き出したら、いったん完了を外す
  next.s = rollUp(Object.assign({}, st, next));
  next.by = name||st.by;
  if(next.s==="doing"&&!st.s0){ next.s0=Date.now(); next.sb=name; }
  setDayState(t, ds, next);
}
/* 自分の担当分だけを終える。全員が終えたらタスクごと完了にする */
function finishMine(t, ds){
  const me=myName||"—";
  const st=dayState(t,ds);
  const w=Object.assign({}, whoMap(st));
  const cur=Object.assign({ s:"todo", a:0, acc:0 }, w[me]||{});
  w[me]={ s:"done", a:0, acc:pElapsed(cur) };
  const next={ who:w, acc:0, a:0, by:me };
  const names=Object.keys(w);
  if(names.length && names.every(n=>w[n].s==="done")){
    next.s="done"; next.p=100; next.d=Date.now();
  } else {
    next.d=st.d||0;
    next.s=rollUp(Object.assign({}, st, next));
  }
  setDayState(t, ds, next);
}
function myWorkState(st){
  const w=whoMap(st), me=myName||"—";
  return (w[me]&&w[me].s)||"todo";
}
function startDay(t, ds){
  applyWho(t, ds, myName||"—", p=>({ s:"doing", a:Date.now(), acc:p.acc||0 }));
}
function pauseDay(t, ds){
  const me=myName||"—";
  const st=dayState(t,ds), w=whoMap(st);
  /* 自分が動いていなければ、動いている人をまとめて止める */
  if(!w[me]||w[me].s!=="doing"){
    const act=activeWorkers(st);
    if(!act.length) return;
    const nw=Object.assign({}, w);
    act.forEach(n=>{ nw[n]={ s:"paused", a:0, acc:pElapsed(w[n]) }; });
    const next={ who:nw, acc:0, a:0 }; next.s=rollUp(Object.assign({},st,next));
    setDayState(t, ds, next);
    return;
  }
  applyWho(t, ds, me, p=>({ s:"paused", a:0, acc:pElapsed(p) }));
}
function resumeDay(t, ds){
  applyWho(t, ds, myName||"—", p=>({ s:"doing", a:Date.now(), acc:p.acc||0 }));
}
function finishDay(t, ds){
  const st=dayState(t,ds), w=whoMap(st), nw={};
  /* 全員の時計を止めて、それぞれの時間を確定させる */
  Object.keys(w).forEach(n=>{ nw[n]={ s:"done", a:0, acc:pElapsed(w[n]) }; });
  setDayState(t, ds, { s:"done", p:100, who:(Object.keys(nw).length?nw:null),
                       acc:0, a:0, d:Date.now(), by:(myName||"") });
}
function resetDay(t, ds){
  setDayState(t, ds, { s:"todo", p:0, a:0, acc:0, d:0, by:"", s0:0, sb:"", who:null });
}

/* 引数は「経過ミリ秒」。秒まで出す（詳細画面用） */
function fmtElapsed(ms){
  let s=Math.floor((ms||0)/1000); if(s<0) s=0;
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), q=s%60;
  return (h>0?h+"時間":"")+m+"分"+q+"秒";
}
/* カレンダーの札は幅が狭いので秒を出さない */
function fmtElapsedShort(ms){
  let s=Math.floor((ms||0)/1000); if(s<0) s=0;
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  return h>0 ? `${h}時間${m}分` : `${m}分`;
}
function fmtDur(ms){
  if(!ms||ms<0) return "";
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  if(h>0) return `${h}時間${m}分`;
  if(m>0) return `${m}分`;
  return `${s}秒`;
}
/* 完了したタスクの実作業時間（止めていた分は含めない） */
function workTime(st){
  if(st.s!=="done") return "";
  /* 全員ぶんの合計。古いデータで記録が無ければ開始→完了の差で出す */
  const ms=elapsedMs(st) || ((st.a&&st.d&&st.d>st.a) ? st.d-st.a : 0);
  return fmtDur(ms);
}
function hhmm(ms){
  if(!ms) return "";
  const d=new Date(ms);
  return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function ownerOf(t){ return (t.owner==="F"||t.owner==="S"||t.owner==="T") ? t.owner : ""; }
/* 白などの明るい色を選んだときは、文字を濃くして枠を付けないと読めなくなる */
function isLightColor(hex){
  const h=String(hex||"").replace("#","");
  if(h.length!==6) return false;
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  if([r,g,b].some(isNaN)) return false;
  return (0.299*r+0.587*g+0.114*b) > 186;
}

/* ===== 並び順（▲▼で入れ替え・2026-08-21 追加） =====
   order を持たないタスクには作成順（id順）で番号を振る。
   同じデータを見ている3人が必ず同じ番号になるので、順番がズレない。      */
function ensureOrders(){
  const noOrd=tasks.filter(t=>typeof t.order!=="number");
  if(!noOrd.length) return;
  let max=tasks.reduce((m,t)=>typeof t.order==="number"?Math.max(m,t.order):m,0);
  noOrd.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0).forEach(t=>{ t.order=++max; });
}
function byOrder(a,b){
  const d=(a.order||0)-(b.order||0);
  return d!==0 ? d : (a.id<b.id?-1:a.id>b.id?1:0);
}
/* つまんだタスクを、離した位置へ一気に動かす。
   その日のタスクが持っている番号を並べ直して配り直すので、
   ほかの日のタスクとの前後関係は崩れない。                        */
function dropInDay(srcId, dstId){
  if(!srcId||!dstId||srcId===dstId) return;
  const list=getDayAllTasks(currentDay).slice().sort(byOrder);
  const si=list.findIndex(t=>t.id===srcId), di=list.findIndex(t=>t.id===dstId);
  if(si<0||di<0) return;
  const nums=list.map(t=>t.order||0).sort((a,b)=>a-b);
  const [item]=list.splice(si,1);
  list.splice(di,0,item);
  list.forEach((t,i)=>{ t.order=nums[i]; });
  try{save();}catch(ex){console.error(ex);}
  renderCalendar(); renderSide(); renderDayBody();
}
function moveInDay(id, dir){
  const list=getDayAllTasks(currentDay).slice().sort(byOrder);
  const i=list.findIndex(t=>t.id===id), j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  const a=list[i], b=list[j], tmp=a.order;
  a.order=b.order; b.order=tmp;
  try{save();}catch(ex){console.error(ex);}
  renderCalendar(); renderSide(); renderDayBody();
}
function avHtml(t, small){
  const o=ownerOf(t);
  return `<span class="av${small?" av-sm":""} av-${o||"x"}">${o||"共"}</span>`;
}
/* 作業した人を色付きの丸で示す */
function whoChip(name){
  if(!name) return "";
  const k=(name==="F"||name==="S"||name==="T") ? name : "x";
  return `<span class="who-chip pw-${k}">${esc(name)}</span>`;
}
function whoChips(names){ return (names||[]).map(whoChip).join(""); }
/* 「T 20分・S 5分」のような人ごとの内訳 */
function breakdown(st){
  const w=whoMap(st);
  return workers(st).map(n=>({ name:n, ms:pElapsed(w[n]),
    doing:w[n].s==="doing", done:w[n].s==="done" }));
}
function pLabel(x){ return x.doing?"作業中":(x.done?"完了":"中断"); }

/* ===== DATE MAP ===== */
function buildDateMap(calStart){
  const m={};
  const add=(d,t)=>{ if(!m[d]) m[d]=[]; if(!m[d].find(x=>x.id===t.id)) m[d].push(t); };
  tasks.forEach(t=>{
    (t.dates||[]).forEach(d=>add(d,t));
    if(t.daysOfWeek&&t.daysOfWeek.length){
      for(let i=0;i<42;i++){
        const cur=new Date(calStart.getFullYear(),calStart.getMonth(),calStart.getDate()+i);
        if(t.daysOfWeek.includes(cur.getDay())&&!(t.skipDates||[]).includes(ymd(cur))) add(ymd(cur),t);
      }
    }
  });
  return m;
}

/* ===== 日付 × 担当者の表 ===== */
/* 列の並び：共通 → T → S → F */
const OWNER_COLS=[
  { key:"",  init:"共", cls:"av-x", label:"共通" },
  { key:"T", init:"T",  cls:"av-T", label:"" },
  { key:"S", init:"S",  cls:"av-S", label:"" },
  { key:"F", init:"F",  cls:"av-F", label:"" }
];

/* いま表示している期間の日付を並べて返す（週は月曜はじまり） */
function periodDates(){
  const out=[];
  if(viewMode==="month"){
    const y=viewDate.getFullYear(), m=viewDate.getMonth();
    const n=new Date(y,m+1,0).getDate();
    for(let i=1;i<=n;i++) out.push(new Date(y,m,i));
  } else {
    const dow=(viewDate.getDay()+6)%7;   // 月曜=0
    const s=new Date(viewDate.getFullYear(),viewDate.getMonth(),viewDate.getDate()-dow);
    for(let i=0;i<7;i++) out.push(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i));
  }
  return out;
}
function periodTitle(ds){
  if(viewMode==="month") return `${viewDate.getFullYear()}年 ${viewDate.getMonth()+1}月`;
  const a=ds[0], b=ds[ds.length-1];
  return `${a.getMonth()+1}/${a.getDate()}(${DOWS[a.getDay()]}) 〜 ${b.getMonth()+1}/${b.getDate()}(${DOWS[b.getDay()]})`;
}

/* タスク1件ぶんの札 */
function pillHtml(t, ds){
  const st=dayState(t,ds);
  const rc=isRecur(t)?"recur":"";
  const ri=isRecur(t)?(st.s==="done"?"✓ ":"🔁 "):"";
  /* 選んだ色は「まだ手をつけていないとき」の見た目。
     対応中・中断中・完了になったら、状態の色（オレンジ／紫／緑）を優先する。 */
  const working=(st.s==="doing"||st.s==="paused"||st.s==="done");
  const useColor=!!t.color && !working;
  /* 濃い色を選んだときは白文字に戻す（まもなくの茶色文字が残ると読めないため） */
  const light=useColor&&isLightColor(t.color);
  const bgStyle=useColor?`style="background:${t.color}${light?"":";color:#fff"}"`:"";
  const lightCls=light?" light":"";
  const live=st.s==="doing"?`<span class="pill-live"></span>`:"";
  const wt=workTime(st);
  let eltime="", hint=`${esc(t.name)}（クリックで詳細）`;
  const bd=breakdown(st);
  const bdText=bd.map(x=>`${x.name} ${fmtElapsedShort(x.ms)}${x.doing?"（作業中）":""}`).join("・");
  if(st.s==="doing"){
    /* 同時に動いている人の丸を並べて、誰がやっているか分かるようにする */
    const act=activeWorkers(st);
    eltime=`<span class="pill-el" data-cel="${t.id}" data-cdate="${ds}">${whoChips(act)}対応中 ${fmtElapsedShort(elapsedMs(st))}</span>`;
    hint=`${esc(t.name)}／対応中${bdText?"　"+bdText:""}`;
  } else if(st.s==="paused"){
    eltime=`<span class="pill-el">${whoChips(bd.map(x=>x.name))}⏸ 中断中 ${fmtElapsedShort(elapsedMs(st))}</span>`;
    hint=`${esc(t.name)}／中断中${bdText?"　"+bdText:""}`;
  } else if(st.s==="done"){
    const chips=whoChips(bd.length?bd.map(x=>x.name):(st.by?[st.by]:[]));
    const label=wt ? `${chips}⏱${wt}` : (chips?`${chips}完了`:"");
    if(label) eltime=`<span class="pill-el">${label}</span>`;
    hint=`${esc(t.name)}／${st.by||"担当者なし"}が完了${wt?"　合計 "+wt:""}${bdText?"（"+bdText+"）":""}`;
  }
  return `<div class="cal-pill ${pillCls(t,ds)} ${rc}${lightCls}" data-pill="${t.id}" data-pdate="${ds}" title="${hint}" ${bgStyle}>`
       + `${live}${avHtml(t,true)}<span class="pill-name">${ri}${esc(t.name)}</span>${eltime}</div>`;
}

/* 表でもスマホ表示でも同じ操作にする（1度だけ結び付ける） */
function bindGrid(grid){
  if(grid.dataset.bound) return;

    if(pill){ openTaskPop(pill.dataset.pill, pill.dataset.pdate); return; }

      openDayModal(dc.dataset.date); return;

    if(oc) openAddModal([oc.dataset.date], oc.dataset.own);
  });
}

    + `</div>`;

    html+=`<div class="orow ${cls}">`
      + `<div class="ocell odate" data-date="${ds}" title="クリックでこの日の詳細／Shift+クリックで選択">`

      +   `<span class="dw">${DOWS[dow]}</span>`
      +   (ds===tStr?`<span class="tdy">今日</span>`:"")
      + `</div>`;
    OWNER_COLS.forEach(c=>{
      const items=list.filter(t=>ownerOf(t)===c.key);
      html+=`<div class="ocell ocol" data-date="${ds}" data-own="${c.key}" title="クリックでここにタスクを追加">`
        + (items.length ? items.map(t=>pillHtml(t,ds)).join("") : `<span class="empty-hint">＋</span>`)

    const a=parse(lastClicked).getTime(),b=parse(s).getTime();
    const lo=Math.min(a,b),hi=Math.max(a,b);
    for(let d=new Date(lo);d.getTime()<=hi;d.setDate(d.getDate()+1)) selected.add(ymd(new Date(d)));
  } else {
    selected.has(s)?selected.delete(s):selected.add(s);
    lastClicked=s;

(function(){
  const body=document.getElementById("dayModalBody");
  let dragId=null;
  const clearHi=()=>body.querySelectorAll(".drop-hi").forEach(x=>x.classList.remove("drop-hi"));
  body.addEventListener("dragstart",e=>{
    const h=e.target.closest("[data-drag]"); if(!h) return;
    dragId=h.dataset.drag;
    e.dataTransfer.effectAllowed="move";
    e.dataTransfer.setData("text/plain",dragId);
    const row=h.closest(".d2row");
    if(row) setTimeout(()=>row.classList.add("dragging"),0);
  });
  body.addEventListener("dragover",e=>{
    if(!dragId) return;
    const row=e.target.closest(".d2row"); if(!row) return;
    e.preventDefault();
    e.dataTransfer.dropEffect="move";
    if(row.dataset.rid===dragId) return;
    clearHi(); row.classList.add("drop-hi");
  });
  body.addEventListener("drop",e=>{
    if(!dragId) return;
    const row=e.target.closest(".d2row"); if(!row) return;
    e.preventDefault();
    const src=dragId; dragId=null; clearHi();
    dropInDay(src,row.dataset.rid);
  });
  body.addEventListener("dragend",()=>{
    dragId=null; clearHi();
    body.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"));
  });
})();

let popId=null, popDate="";
function openTaskPop(id, ds){
  const t=tasks.find(x=>x.id===id); if(!t) return;
  popId=id; popDate=ds||currentDay||todayStr();
  drawTaskPop();

function closeTaskPop(){
  popId=null;
  const ov=document.getElementById("popOverlay");
  ov.classList.remove("open"); ov.innerHTML="";

function drawTaskPop(){
  const t=tasks.find(x=>x.id===popId); if(!t) return;
  const st=dayState(t,popDate);
  const bd=breakdown(st);
  /* 最初に作業を始めた日時と人 */
  const startLine = st.s0
    ? `<div class="popfact"><span class="k">作業開始</span><b><span class="num">${hhmm(st.s0)}</span>${st.sb?"　"+esc(st.sb):""}</b></div>`
    : (st.a?`<div class="popfact"><span class="k">作業開始</span><b><span class="num">${hhmm(st.a)}</span>${st.by?"　"+esc(st.by):""}</b></div>`:"");
  /* 誰が何分やったかの一覧 */
  const bdBlock = bd.length
    ? `<div class="wlist"><div class="wlist-h">作業した人</div>`
      + bd.map(x=>`<div class="wrow">${whoChip(x.name)}<span class="wn">${esc(x.name)}</span>`
        + `<span class="wst ${x.doing?"is-doing":(x.done?"is-done":"is-pause")}">${pLabel(x)}</span>`
        + `<span class="wt num">${fmtElapsed(x.ms)}</span></div>`).join("")
      + `</div>` : "";
  let tag,facts,act;
  if(st.s==="done"){
    tag=`<span class="d2tag done">完了</span>`;
    const wt=workTime(st);
    facts=startLine
        + `<div class="popfact"><span class="k">完了</span><b>${st.d?`<span class="num">${hhmm(st.d)}</span>`:"—"}${st.by?"　"+esc(st.by):""}</b></div>`
        + (wt?`<div class="popfact"><span class="k">作業時間の合計</span><b class="num" style="color:var(--done)">${wt}</b></div>`:"")
        + bdBlock;
    act=`<button class="popact go" data-act="go">＋ 作業を再開する（自分が加わる）</button>`
      + `<button class="popact" data-act="back">未着手に戻す</button>`;
  } else if(st.s==="doing"){
    tag=`<span class="d2tag doing">対応中</span>`;
    facts=startLine
        + `<div class="popfact"><span class="k">経過時間の合計</span><b class="num" id="popEl">${fmtElapsed(elapsedMs(st))}</b></div>`
        + bdBlock;
    const mine=myWorkState(st);
    act=(mine==="doing"
        ? `<button class="popact" data-act="pause">⏸ 中断する（あとで再開）</button>`
        + `<button class="popact go" data-act="mine">✓ 自分の作業を終える</button>`
        : `<button class="popact go" data-act="go">＋ 自分も作業に加わる</button>`)
      + `<button class="popact fin" data-act="done">タスクを完了にする</button>`;
  } else if(st.s==="paused"){
    tag=`<span class="d2tag paused">⏸ 中断中</span>`;
    facts=startLine
        + `<div class="popfact"><span class="k">ここまでの作業</span><b class="num">${fmtElapsed(elapsedMs(st))}</b></div>`
        + bdBlock;
    act=`<button class="popact go" data-act="resume">▶ 再開する</button>`
      + (myWorkState(st)==="paused"?`<button class="popact" data-act="mine">✓ 自分の作業を終える</button>`:"")
      + `<button class="popact fin" data-act="done">タスクを完了にする</button>`;
  } else {
    tag=`<span class="d2tag todo">未着手</span>`;
    facts=`<div class="popfact"><span class="k">作業開始</span><b style="font-weight:400;color:var(--muted)">まだ押していません</b></div>`;
    act=`<button class="popact" data-act="go">作業開始</button>`;
  }
  const rc=isRecur(t)?`<div class="popfact"><span class="k">繰り返し</span><b>${fmtDows(t.daysOfWeek)}</b></div>`:"";
  document.getElementById("popOverlay").innerHTML=
   `<div class="pop">
      <div class="pophead">${avHtml(t)}<h4>${esc(t.name)}</h4>${tag}
        <button class="m-close" data-x="1">✕</button>
      </div>
      <div class="popnote">${t.note?esc(t.note):"（メモはありません）"}</div>
      <div class="popfact"><span class="k">日付</span><b>${fmtDateLong(popDate)}</b></div>
      ${rc}${facts}
      ${act}
      <button class="popact" data-act="edit" style="margin-top:8px">タスクを編集</button>
      <button class="popact" data-x="1" style="margin-top:8px">閉じる</button>
    </div>`;
}

document.getElementById("dayBulkMove").addEventListener("click",()=>{
  const newDate=document.getElementById("dayBulkDate").value;
  if(!newDate){ document.getElementById("dayBulkDate").focus(); return; }
  const list=getDayAllTasks(currentDay);
  if(!list.length){ alert("この日に移動できるタスクがありません。"); return; }
  if(!confirm(`${fmtDateLong(currentDay)} の全タスク（${list.length}件）を ${newDate} へ移動しますか？\n※元の日の予定は削除されます。`)) return;
  const toDelete=[];
  list.forEach(t=>{
    if(isRecur(t)){
      tasks.push({...t, id:uid(), dates:[newDate], daysOfWeek:[], completedDates:[], skipDates:[]});
      if(!t.skipDates) t.skipDates=[];
      if(!t.skipDates.includes(currentDay)) t.skipDates.push(currentDay);
    } else {
      if(!t.dates.includes(newDate)){ t.dates.push(newDate); t.dates.sort(); }
      const idx=t.dates.indexOf(currentDay);
      if(idx!==-1){ t.dates.splice(idx,1); if(!t.dates.length) toDelete.push(t.id); }
    }
  });
  if(toDelete.length) tasks=tasks.filter(x=>!toDelete.includes(x.id));
  try{save();}catch(ex){console.error(ex);}
  closeDayModal(); renderAll();
});

  let arr=tasks.slice();
  if(sideFilter==="overdue") arr=arr.filter(t=>urgency(t)==="overdue"||urgency(t)==="soon");
  else if(sideFilter==="recur") arr=arr.filter(isRecur);
  else if(sideFilter!=="all") arr=arr.filter(t=>t.status===sideFilter);
  if(sideOwner!=="any") arr=arr.filter(t=>ownerOf(t)===sideOwner);
  const isManual = sideSort==="manual";
  if(!isManual){
    arr.sort((a,b)=>{
      if(sideSort==="status"){
        const ord={doing:0,todo:1,done:2};
        return (ord[a.status]??1)-(ord[b.status]??1);
      }
      if(sideSort==="name") return a.name.localeCompare(b.name,"ja");
      if(sideSort==="created") return a.id<b.id?-1:a.id>b.id?1:0;
      if((a.status==="done")!==(b.status==="done")) return a.status==="done"?1:-1;
      const da=a.dates.length?Math.min(...a.dates.map(d=>parse(d).getTime())):Infinity;
      const db=b.dates.length?Math.min(...b.dates.map(d=>parse(d).getTime())):Infinity;
      return da-db;
    });
  }
  document.getElementById("sideCount").textContent=`${arr.length}件`;
  const el=document.getElementById("taskScroll");
  if(!arr.length){ el.innerHTML=`<div class="empty-msg">タスクがありません。</div>`; return; }
  el.innerHTML=arr.map(t=>{
    const u=urgency(t); const rc=isRecur(t);
    let warn="";
    if(u==="overdue") warn=`<span class="badge overdue">期限切れ</span>`;
    else if(u==="soon"){ const n=t.dates.map(daysUntil).filter(d=>d>=0).sort((a,b)=>a-b)[0]; warn=`<span class="badge soon">${n===0?"本日":"あと"+n+"日"}</span>`; }
    const dateStr=t.dates.length?t.dates.map(fmtDate).join(" / "):"";
    const dowStr=rc?fmtDows(t.daysOfWeek):"";
    let recurProgress="";
    if(rc){
      const now=new Date(), y=now.getFullYear(), m=now.getMonth();
      const daysInMonth=new Date(y,m+1,0).getDate();
      let total=0,done=0;
      for(let d=1;d<=daysInMonth;d++){
        const dt=new Date(y,m,d);
        if(t.daysOfWeek.includes(dt.getDay())){
          total++;
          if((t.completedDates||[]).includes(ymd(dt))) done++;
        }
      }
      recurProgress=`<span style="font-size:11px;background:${done===total&&total>0?"#e6f7ef":"#f0f3f8"};color:${done===total&&total>0?"#1a7a45":"var(--muted)"};border-radius:10px;padding:1px 7px;font-weight:600;">${done}/${total}日完了</span>`;
    }
    const cardStyle=t.color?` style="border-left-color:${t.color}"`:"";
    return `<div class="task-card ${u||t.status} ${rc?"recur":""} ${isManual?"sortable":""}" data-id="${t.id}"${cardStyle}>
      <span class="drag-handle" title="ドラッグして並び替え">⠿</span>
      <div class="task-card-body">
        <div class="tname" style="display:flex;align-items:center;gap:7px">${avHtml(t,true)}<span>${esc(t.name)}</span></div>
        <div class="tmeta">
          <span class="badge ${t.status}">${SL[t.status]}${t.processedBy&&t.status!=="todo"?" "+esc(t.processedBy):""}</span>
          ${dateStr?`<span>🗓 ${esc(dateStr)}</span>`:""}
          ${dowStr?`<span>🔁 ${esc(dowStr)}</span>`:""}
          ${recurProgress}
          ${warn}
        </div>
      </div>
    </div>`;
  }).join("");

  el.querySelectorAll(".task-card").forEach(c=>{
    c.addEventListener("click", e=>{
      if(e.target.closest(".drag-handle")) return;
      openEditModal(c.dataset.id);
    });
    if(!isManual) return;
    c.setAttribute("draggable","true");
    c.addEventListener("dragstart", e=>{
      e.dataTransfer.effectAllowed="move";
      e.dataTransfer.setData("text/plain", c.dataset.id);
      setTimeout(()=>c.classList.add("dragging"), 0);
    });
    c.addEventListener("dragend", ()=>{
      c.classList.remove("dragging");
      el.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));
    });
    c.addEventListener("dragover", e=>{
      e.preventDefault();
      el.querySelectorAll(".drag-over").forEach(x=>x.classList.remove("drag-over"));
      c.classList.add("drag-over");
    });
    c.addEventListener("drop", e=>{
      e.preventDefault();
      c.classList.remove("drag-over");
      const srcId=e.dataTransfer.getData("text/plain");
      const dstId=c.dataset.id;
      if(srcId===dstId) return;
      const srcIdx=tasks.findIndex(t=>t.id===srcId);
      const dstIdx=tasks.findIndex(t=>t.id===dstId);
      if(srcIdx<0||dstIdx<0) return;
      const [item]=tasks.splice(srcIdx,1);
      tasks.splice(dstIdx,0,item);
      tasks.forEach((t,i)=>{ t.order=i+1; });   // 並べた結果を order に焼き付けて保存する
      try{ save(); }catch(e){ console.error(e); }
      renderSide(); renderCalendar();
    });
  });
}

/* ===== NAVIGATION ===== */
function shiftPeriod(dir){
  if(viewMode==="month") viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+dir,1);
  else viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth(),viewDate.getDate()+dir*7);
  renderCalendar();
}
document.getElementById("prevBtn" ).addEventListener("click",()=>shiftPeriod(-1));
document.getElementById("nextBtn" ).addEventListener("click",()=>shiftPeriod(1));
document.getElementById("todayBtn").addEventListener("click",()=>{ viewDate=new Date(); renderCalendar(); });
document.querySelectorAll(".segb").forEach(b=>b.addEventListener("click",()=>{
  if(viewMode===b.dataset.mode) return;
  viewMode=b.dataset.mode;
  try{ localStorage.setItem("calViewMode",viewMode); }catch(e){}
  renderCalendar();
}));
/* ===== 日付へ移動：1か月のカレンダーから選ぶ ===== */
let mpDate=new Date();
function openMonthPicker(){
  mpDate=new Date(viewDate);
  drawMonthPicker();
  const ov=document.getElementById("mpOverlay");
  ov.classList.add("open");                       // 先に出さないと大きさが測れない
  const mp=document.getElementById("mp");
  const b=document.getElementById("jumpBtn").getBoundingClientRect();
  const vw=Math.max(320, window.innerWidth||document.documentElement.clientWidth||1280);
  const vh=Math.max(320, window.innerHeight||document.documentElement.clientHeight||720);
  const w=mp.offsetWidth||276, h=mp.offsetHeight||350;
  let top=b.bottom+6;
  if(top+h>vh-8) top=b.top-h-6;                   // 下に入らなければボタンの上に出す
  mp.style.top =Math.max(8, Math.min(top,   vh-h-8))+"px";
  mp.style.left=Math.max(8, Math.min(b.left, vw-w-8))+"px";
}
function closeMonthPicker(){ document.getElementById("mpOverlay").classList.remove("open"); }
function drawMonthPicker(){
  const y=mpDate.getFullYear(), m=mpDate.getMonth();
  const first=new Date(y,m,1);
  const start=new Date(y,m,1-((first.getDay()+6)%7));   // 月曜はじまり
  const tStr=todayStr();
  const inView=periodDates().map(d=>ymd(d));
  const dm=buildDateMap(start);
  let cells="";
  for(let i=0;i<42;i++){
    const cur=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const ds=ymd(cur), dow=cur.getDay();
    const cls=[
      cur.getMonth()!==m?"out":"",
      ds===tStr?"today":"",
      inView.includes(ds)?"inview":"",
      dow===0?"sun":dow===6?"sat":""
    ].join(" ");
    cells+=`<button class="mp-d ${cls}" data-jump="${ds}" title="${fmtDateLong(ds)}">${cur.getDate()}`
         + ((dm[ds]||[]).length?`<i class="dotm"></i>`:"")
         + `</button>`;
  }
  document.getElementById("mp").innerHTML=
    `<div class="mp-head">
       <button class="mp-nav" data-mp="-1" title="前の月">◀</button>
       <div class="t">${y}年 ${m+1}月</div>
       <button class="mp-nav" data-mp="1" title="次の月">▶</button>
     </div>
     <div class="mp-dows">${["月","火","水","木","金","土","日"].map((d,i)=>`<div class="${i===5?"sat":i===6?"sun":""}">${d}</div>`).join("")}</div>
     <div class="mp-grid">${cells}</div>
     <div class="mp-foot">
       <button data-jump="${tStr}">今日へ</button>
       <button data-mpclose="1">閉じる</button>
     </div>
     <div class="mp-hint">・印のある日はタスクがあります</div>`;
}
document.getElementById("jumpBtn").addEventListener("click",openMonthPicker);
document.getElementById("mpOverlay").addEventListener("click",e=>{
  if(e.target===e.currentTarget){ closeMonthPicker(); return; }
  const nav=e.target.closest("[data-mp]");
  if(nav){ mpDate=new Date(mpDate.getFullYear(),mpDate.getMonth()+Number(nav.dataset.mp),1); drawMonthPicker(); return; }
  if(e.target.closest("[data-mpclose]")){ closeMonthPicker(); return; }
  const j=e.target.closest("[data-jump]");
  if(j){ viewDate=parse(j.dataset.jump); jumpTarget=j.dataset.jump; closeMonthPicker(); renderCalendar(); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&document.getElementById("mpOverlay").classList.contains("open")) closeMonthPicker();
});
/* タスク一覧（左）の表示・非表示。ノートPCでは畳んだほうが表が広く使える */
function applySide(){
  /* スマホ表示のときは一覧を出さない（画面が狭いため） */
  document.querySelector(".app").classList.toggle("no-side",!sideOpen||mobileMode);
  document.getElementById("sideToggle").classList.toggle("primary",sideOpen&&!mobileMode);
  /* 画面が狭いときはボタンの文字を短くして、ナビが折り返さないようにする */
  const narrow=window.innerWidth<600;
  const mb=document.getElementById("mobileToggle");
  mb.textContent = mobileMode ? (narrow?"🖥":"🖥 表で見る") : (narrow?"📱":"📱 スマホ");
  mb.classList.toggle("primary",mobileMode);
  const jb=document.getElementById("jumpBtn");
  if(jb) jb.textContent = narrow ? "📅" : "📅 日付へ移動";
  const qa=document.getElementById("quickAddBtn");
  if(qa) qa.textContent = narrow ? "＋ 追加" : "＋ タスクを追加";
}
window.addEventListener("resize",()=>{ applySide(); });
document.getElementById("mobileToggle").addEventListener("click",()=>{
  mobileMode=!mobileMode;
  try{ localStorage.setItem("calMobile",mobileMode?"1":"0"); }catch(e){}
  applySide(); renderCalendar();
});
document.getElementById("sideToggle").addEventListener("click",()=>{
  sideOpen=!sideOpen;
  try{ localStorage.setItem("calSideOpen",sideOpen?"1":"0"); }catch(e){}
  applySide();
});
document.getElementById("quickAddBtn").addEventListener("click",()=>openAddModal(selected.size?[...selected].sort():[todayStr()]));

/* ===== エクスポート / インポート ===== */
document.getElementById("exportBtn").addEventListener("click",()=>{
  const data=JSON.stringify(tasks);   // 共有DBの現在の内容（2026-08-18）
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`業務管理カレンダー_${ymd(new Date())}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
});
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error();
      if(!confirm(`${data.length}件のタスクをインポートします。\n現在のデータは上書きされます。よろしいですか？`)) return;
      if(!tasksRef){ alert("ログインしてから実行してください。"); return; }
      const map={};
      data.forEach(t=>{ const x=normalizeTask(Object.assign({},t)); if(!x.id) x.id=uid(); map[x.id]=x; });
      tasksRef.set(map)
        .then(()=>alert(`インポートが完了しました（${data.length}件）。`))
        .catch(err=>{ console.error(err); alert("インポートに失敗しました。権限と通信状態を確認してください。"); });
    }catch(ex){ alert("ファイルの読み込みに失敗しました。正しいJSONファイルを選択してください。"); }
    e.target.value="";
  };
  reader.readAsText(file,"UTF-8");
});

/* ===== ログインして起動（2026-08-18） =====
   ・許可されたGoogleアカウントだけが中に入れる
   ・表示名（F/S/T）は Firebase の /members から引く＝HTMLにメールアドレスを書かない
     （公開リポジトリなので、書くと誰でも読めてしまう）
   ・サンプルデータの自動投入は廃止（共有DBに勝手に入ると困るため）           */

/* ページ表示時に常に当月へ */
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){ viewDate=new Date(); renderCalendar(); }
});

const gate=document.getElementById("authGate");
const gateMsg=document.getElementById("authMsg");
const gateBtn=document.getElementById("authBtn");
const gateBusy=document.getElementById("authBusy");

function showGate(msg){
  gateMsg.innerHTML=msg;
  gate.style.display="flex";
  gateBtn.hidden=false; gateBusy.hidden=true;
}
let _denied=false;   // 拒否メッセージがログアウト処理に上書きされるのを防ぐ（2026-08-18）
function denied(email){
  _denied=true;
  firebase.auth().signOut();
  showGate("このアカウント<br><b>"+esc(email)+"</b><br>は許可されていません。<br>担当者にご連絡ください。");
}

if(String(FB_CFG.apiKey).indexOf("★")>=0){
  showGate("まだ設定が入っていません。<br>Firebaseの設定を貼ってください。");
}else{
  firebase.initializeApp(FB_CFG);
  fbDb=firebase.database();

  gateBtn.addEventListener("click",()=>{
    _denied=false;
    const p=new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({prompt:"select_account"});
    gateBtn.hidden=true; gateBusy.hidden=false;
    firebase.auth().signInWithPopup(p).catch(e=>{
      console.error(e);
      showGate("ログインできませんでした。<br>もう一度お試しください。");
    });
  });

  document.getElementById("logoutBtn").addEventListener("click",()=>{
    if(confirm("ログアウトしますか？")) firebase.auth().signOut();
  });

  firebase.auth().onAuthStateChanged(user=>{
    if(!user){
      myName=""; tasksRef=null;
      // 直前に拒否した場合は、その理由を消さない（signOutでここが走るため）
      if(_denied){ gateBtn.hidden=false; gateBusy.hidden=true; return; }
      showGate("スタッフ用です。<br>Googleアカウントでログインしてください。");
      return;
    }
    gateBtn.hidden=true; gateBusy.hidden=false;
    const key=String(user.email||"").replace(/\./g,",");   // Firebaseのキーに . は使えない
    fbDb.ref("members/"+key).once("value").then(snap=>{
      const nm=snap.val();
      if(!nm){ denied(user.email); return; }
      myName=nm;
      document.getElementById("whoChip").textContent=nm+" さん";
      gate.style.display="none";
      tasksRef=fbDb.ref("tasks");
      startSync();
      updateSelHint();
    }).catch(e=>{ console.error(e); denied(user.email); });
  });
}
})();
